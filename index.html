<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ローカル音声認識（強化版）</title>

<style>
body {
    font-family: sans-serif;
    margin: 20px;
    background: #f5f5f5;
}
button, select {
    font-size: 18px;
    padding: 10px 20px;
    margin-right: 10px;
}
textarea {
    width: 100%;
    height: 450px;
    font-size: 16px;
    padding: 10px;
}
</style>

</head>
<body>

<h2>ローカル音声認識（強化版 / 日本語・英語切替）</h2>

<label>言語：</label>
<select id="langSelect">
    <option value="ja-JP">日本語</option>
    <option value="en-US">English</option>
</select>

<button id="startBtn">開始</button>
<button id="stopBtn">停止</button>
<button id="saveBtn">保存</button>
<button id="copyBtn">コピー</button>

<textarea id="output">
【ChatGPTへの依頼】
以下の「文字起こしテキスト」を自然な日本語に整形し、
意味が通るように句読点挿入・誤認識修正・段落化をしてください。

------------------------------
【文字起こしテキストここから】
</textarea>

<script>

let recognition;
let isRecognizing = false;
let lastText = "";

// ノイズ・母音連打・意味のない短文を排除
function isNoise(t) {
    if (!t) return true;
    if (t.length <= 1) return true;  
    if (/([あいうえおアイウエオ])\1{2,}/.test(t)) return true;
    if (/^[a-zA-Z]{1,2}$/.test(t)) return true;
    if (/^([ﾊﾋﾌﾍﾎ])\1+$/.test(t)) return true;
    return false;
}

// 類似文チェック
function isSimilar(a, b) {
    if (!a || !b) return false;
    const min = Math.min(a.length, b.length);
    if (min < 6) return false;
    const seg = Math.floor(min * 0.75);
    return a.slice(0, seg) === b.slice(0, seg);
}

// 軽い句読点補完（日本語の場合のみ）
function autoPunctuation(t, lang) {
    if (lang === "ja-JP") {
        if (!/[。！？」]$/.test(t)) {
            return t + "。";
        }
    }
    return t;
}

// 音声認識セットアップ
function initRecognition(lang) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.lang = lang;
    recognition.interimResults = false;
    recognition.continuous = true;

    recognition.onresult = (event) => {
        let text = event.results[event.results.length - 1][0].transcript.trim();
        if (isNoise(text)) return;
        if (isSimilar(text, lastText)) return;

        lastText = text;

        text = autoPunctuation(text, lang);

        output.value += text + "\n";
        output.scrollTop = output.scrollHeight;
    };

    // 停止時に自動再起動
    recognition.onend = () => {
        if (isRecognizing) {
            setTimeout(() => recognition.start(), 200);
        }
    };
}

// 初期化
initRecognition("ja-JP");

const output = document.getElementById("output");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const saveBtn = document.getElementById("saveBtn");
const copyBtn = document.getElementById("copyBtn");
const langSelect = document.getElementById("langSelect");

// 言語変更
langSelect.onchange = () => {
    const lang = langSelect.value;
    const running = isRecognizing;
    lastText = "";

    if (isRecognizing) {
        recognition.stop();
        isRecognizing = false;
    }

    initRecognition(lang);

    if (running) {
        recognition.start();
        isRecognizing = true;
    }

    output.value += `\n--- 言語切替: ${lang} ---\n`;
};

// 録音開始
startBtn.onclick = () => {
    if (!isRecognizing) {
        lastText = "";
        recognition.start();
        isRecognizing = true;
        output.value += "\n--- 録音開始 ---\n";
    }
};

// 録音停止
stopBtn.onclick = () => {
    if (isRecognizing) {
        recognition.stop();
        isRecognizing = false;
        output.value += "\n--- 録音停止 ---\n";
    }
};

// 保存
saveBtn.onclick = () => {
    const blob = new Blob([output.value], { type: "text/plain" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "transcript_" + new Date().toISOString().replace(/[:.]/g, "-") + ".txt";
    a.click();
    URL.revokeObjectURL(url);
};

// コピー
copyBtn.onclick = () => {
    output.select();
    document.execCommand("copy");
};
</script>

</body>
</html>
