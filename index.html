<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ローカル音声認識（ゆるゆる版 / ChatGPTプロンプト付き）</title>
<style>
body {
    font-family: sans-serif;
    margin: 20px;
    background: #f5f5f5;
}
button, select {
    font-size: 18px;
    padding: 10px 20px;
    margin-right: 10px;
}
textarea {
    width: 100%;
    height: 450px;
    font-size: 16px;
    padding: 10px;
}
</style>
</head>
<body>

<h2>ローカル音声認識（ゆるゆる版 / 日本語・英語切替）</h2>

<label>言語：</label>
<select id="langSelect">
    <option value="ja-JP">日本語</option>
    <option value="en-US">English</option>
</select>

<button id="startBtn">開始</button>
<button id="stopBtn">停止</button>
<button id="saveBtn">保存</button>
<button id="copyBtn">コピー</button>

<p>
※Google アカウント不要・APIキー不要<br>
※Chrome推奨（Safari/Firefox不可）
</p>

<textarea id="output">
【ChatGPTへの依頼】
以下の「文字起こしテキスト」を自然な日本語に整形し、
意味が通るように段落化・句読点挿入・誤認識修正をしてください。

必要なら：
・要約
・話者ごとの整理
・読みやすい文章化
なども行ってください。

------------------------------
【文字起こしテキストここから】
</textarea>

<script>
let recognition;
let isRecognizing = false;

// ゆるい前回テキスト記録
let lastText = "";

// ▼ ゆるゆる重複防止（語尾1語だけ）
function isDuplicate(newText, prevText) {
    const nt = newText.trim().split(/\s+/);
    const pt = prevText.trim().split(/\s+/);

    const ntail = nt.slice(-1)[0];
    const ptail = pt.slice(-1)[0];

    return ntail === ptail;
}

// ▼ ゆるゆる暴走防止（極端な繰り返しのみブロック）
function isNoisePattern(text) {
    // 母音系の6連続以上
    if (/([あいうえおアイウエオおーぁぃぅぇぉoaiue])\1{5,}/.test(text)) return true;

    // 英単語の8連続以上
    if (/(\b\w+\b)( \1){7,}/i.test(text)) return true;

    return false;
}

function initRecognition(lang) {
    try {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SR();
        recognition.lang = lang;
        recognition.interimResults = false;
        recognition.continuous = true;
    } catch (e) {
        alert("このブラウザは音声認識に対応していません。Chromeを使用してください。");
        return;
    }

    recognition.onresult = (event) => {
        let finalText = event.results[event.results.length - 1][0].transcript.trim();

        // ▼ ゆるゆる暴走防止
        if (isNoisePattern(finalText)) return;

        // ▼ ゆるゆる重複防止
        if (isDuplicate(finalText, lastText)) {
            return;
        }

        lastText = finalText;

        output.value += finalText + "\n";
        output.scrollTop = output.scrollHeight;
    };

    recognition.onend = () => {
        if (isRecognizing) recognition.start();
    };
}

// 初期言語
initRecognition("ja-JP");

const output = document.getElementById("output");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const saveBtn = document.getElementById("saveBtn");
const copyBtn = document.getElementById("copyBtn");
const langSelect = document.getElementById("langSelect");

// 言語変更
langSelect.onchange = () => {
    const lang = langSelect.value;

    lastText = ""; // リセット

    if (isRecognizing) {
        recognition.stop();
        isRecognizing = false;
    }

    initRecognition(lang);

    recognition.start();
    isRecognizing = true;

    output.value += `\n--- 言語を変更しました (${lang}) ---\n`;
};

// 開始
startBtn.onclick = () => {
    if (!isRecognizing) {
        lastText = "";
        recognition.start();
        isRecognizing = true;
        output.value += "\n--- 録音開始 ---\n";
    }
};

// 停止
stopBtn.onclick = () => {
    if (isRecognizing) {
        recognition.stop();
        isRecognizing = false;
        output.value += "\n--- 録音停止 ---\n";
    }
};

// 保存
saveBtn.onclick = () => {
    const blob = new Blob([output.value], { type: "text/plain" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "transcript_" + new Date().toISOString().replace(/[:.]/g, "-") + ".txt";
    a.click();

    URL.revokeObjectURL(url);
};

// コピー
copyBtn.onclick = () => {
    output.select();
    document.execCommand("copy");
    alert("コピーしました");
};
</script>

</body>
</html>
