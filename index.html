<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ローカル音声認識（ChatGPTプロンプト付き）</title>
<style>
body {
    font-family: sans-serif;
    margin: 20px;
    background: #f5f5f5;
}
button, select {
    font-size: 18px;
    padding: 10px 20px;
    margin-right: 10px;
}
textarea {
    width: 100%;
    height: 450px;
    font-size: 16px;
    padding: 10px;
}
</style>
</head>
<body>

<h2>ローカル音声認識（ChatGPTプロンプト付き / 日本語・英語切替）</h2>

<label>言語：</label>
<select id="langSelect">
    <option value="ja-JP">日本語</option>
    <option value="en-US">English</option>
</select>

<button id="startBtn">開始</button>
<button id="stopBtn">停止</button>
<button id="saveBtn">保存</button>
<button id="copyBtn">コピー</button>

<p>
※Google アカウント不要・APIキー不要<br>
※Chrome推奨（Safari/Firefox不可）
</p>

<textarea id="output">
【ChatGPTへの依頼】
以下の「文字起こしテキスト」を自然な日本語に整形し、
意味が通るように段落化・句読点挿入・誤認識修正をしてください。

必要なら：
・要約
・話者ごとの整理
・読みやすい文章化
なども行ってください。

------------------------------
【文字起こしテキストここから】
</textarea>

<script>
let recognition;
let isRecognizing = false;

// ★ 前回の確定テキスト
let lastText = "";

// ★ 前回の認識時刻（暴走防止用）
let lastTime = 0;

// ★★★ 強力重複フィルタ（語尾3語 N-gram 判定）★★★
function isDuplicate(newText, prevText) {
    const nt = newText.trim().split(/\s+/);
    const pt = prevText.trim().split(/\s+/);

    const N = 3;
    const ntail = nt.slice(-N).join(" ");
    const ptail = pt.slice(-N).join(" ");

    return ntail === ptail;
}

// ★★★ 誤認識暴走フィルタ（母音連打・記号崩壊など）★★★
function isNoisePattern(text) {
    // 「おおおおお」「ううううう」「iii」「おいおいおい…」
    if (/([あいうえおアイウエオおーうぃoaiue])\1{3,}/.test(text)) return true;

    // 英語暴走パターン
    if (/(\b\w+\b)( \1){3,}/i.test(text)) return true;

    return false;
}

// ★ 初期化
function initRecognition(lang) {
    try {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SR();
        recognition.lang = lang;
        recognition.interimResults = false;
        recognition.continuous = true;
    } catch (e) {
        alert("このブラウザは音声認識に対応していません。Chromeを使用してください。");
        return;
    }

    recognition.onresult = (event) => {
        let finalText = event.results[event.results.length - 1][0].transcript.trim();

        // ▼ 暴走パターン排除
        if (isNoisePattern(finalText)) return;

        // ▼ 1秒以内に同じようなものが来たら排除
        const now = Date.now();
        if (now - lastTime < 1000) {
            if (isDuplicate(finalText, lastText)) return;
        }
        lastTime = now;

        // ▼ 語尾N-gram 重複排除
        if (isDuplicate(finalText, lastText)) return;

        lastText = finalText;

        output.value += finalText + "\n";
        output.scrollTop = output.scrollHeight;
    };

    recognition.onend = () => {
        if (isRecognizing) recognition.start();
    };
}

// ★ 初期言語は日本語
initRecognition("ja-JP");

const output = document.getElementById("output");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const saveBtn = document.getElementById("saveBtn");
const copyBtn = document.getElementById("copyBtn");
const langSelect = document.getElementById("langSelect");

// 言語変更
langSelect.onchange = () => {
    const lang = langSelect.value;
    const wasRunning = isRecognizing;

    // 判定リセット
    lastText = "";
    lastTime = 0;

    if (isRecognizing) {
        recognition.stop();
        isRecognizing = false;
    }

    initRecognition(lang);

    if (wasRunning) {
        recognition.start();
        isRecognizing = true;
    }

    output.value += `\n--- 言語を変更しました (${lang}) ---\n`;
};

// 開始
startBtn.onclick = () => {
    if (!isRecognizing) {
        lastText = "";
        lastTime = 0;

        recognition.start();
        isRecognizing = true;
        output.value += "\n--- 録音開始 ---\n";
    }
};

// 停止
stopBtn.onclick = () => {
    if (isRecognizing) {
        recognition.stop();
        isRecognizing = false;
        output.value += "\n--- 録音停止 ---\n";
    }
};

// 保存
saveBtn.onclick = () => {
    const blob = new Blob([output.value], { type: "text/plain" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "transcript_" + new Date().toISOString().replace(/[:.]/g, "-") + ".txt";
    a.click();

    URL.revokeObjectURL(url);
};

// コピー
copyBtn.onclick = () => {
    output.select();
    document.execCommand("copy");
    alert("コピーしました");
};
</script>

</body>
</html>
